name: Full site checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-site-checks
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Refresh dust forecast
        run: node scripts/update-dust.mjs
        continue-on-error: true

      - name: Run full site checks
        run: pnpm gate:full
        env:
          CI_BROWSER_REGRESSION_JOB: separate
          # WebKit's media stack is platform-specific; native playback is
          # required separately on macOS, matching Safari's target platform.
          RIDE_FILM_ENGINES: chromium

      - name: Upload gate screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-gate-screenshots
          path: artifacts/gate/automated

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated Chromium interaction regression
        run: pnpm test:browser
        env:
          BROWSER_REGRESSION_ENGINES: chromium

  ride-film-playback:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native WebKit
        run: pnpm exec playwright install webkit

      - name: Build and check archival film playback
        run: |
          pnpm build:site
          node scripts/ride-film-check.mjs site
        env:
          RIDE_FILM_ENGINES: webkit

      - name: Upload WebKit playback screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-webkit-ride-film
          path: artifacts/gate/automated/ride-film

